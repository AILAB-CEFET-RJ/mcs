# experiments/experiments.yaml

global:
  seed: 42
  use_fixed_seed: false
  n_jobs_xgb: 8
  early_stopping_rounds: 20
  runs_dir: "runs"
  run_label: "stage3_method_corrected_v2"
  output_tag: "METHOD_CORRECTED_V2"
  final_seeds: [109, 220, 222, 241, 149, 107, 75, 248, 254, 140]
  trials_per_round: [10, 10, 10]

  directions:
    - minimize  # MSE
    - minimize  # RMSE
    - minimize  # MAE
    - minimize  # -R²
    - minimize  # MAPE
    - minimize  # SMAPE
    - minimize  # -Spearman rho
    - minimize  # Poisson Deviance

experiments:
  - dataset: data/datasets/RN_DAILY/dataset.pickle
    models: [poisson, zip, rf]
    name: RN_DAILY
    train_config: config/train_natal_daily.yaml

  - dataset: data/datasets/RN_WEEKLY/dataset.pickle
    models: [poisson, zip, rf]
    name: RN_WEEKLY
    train_config: config/train_natal_weekly.yaml

  - dataset: data/datasets/RN_DAILY_CASESONLY/dataset.pickle
    models: [poisson, zip, rf]
    name: RN_DAILY_CASESONLY
    train_config: config/train_natal_daily_casesonly.yaml

  - dataset: data/datasets/RN_WEEKLY_CASESONLY/dataset.pickle
    models: [poisson, zip, rf]
    name: RN_WEEKLY_CASESONLY
    train_config: config/train_natal_weekly_casesonly.yaml

  - dataset: data/datasets/RJ_WEEKLY_CASESONLY/dataset.pickle
    models: [poisson, zip, rf]
    name: RJ_WEEKLY_CASESONLY
    train_config: config/train_rj_weekly_casesonly.yaml

  - dataset: data/datasets/RJ_DAILY/dataset.pickle
    models: [poisson, zip, rf]
    name: RJ_DAILY
    train_config: config/train_rj_daily.yaml

  - dataset: data/datasets/RJ_DAILY_CASESONLY/dataset.pickle
    models: [poisson, zip, rf]
    name: RJ_DAILY_CASESONLY
    train_config: config/train_rj_daily_casesonly.yaml

  - dataset: data/datasets/RJ_WEEKLY/dataset.pickle
    models: [poisson, zip, rf]
    name: RJ_WEEKLY
    train_config: config/train_rj_weekly.yaml
